name: Android APK
on:
 workflow_dispatch:
 push:
  branches: [main]
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-24.04
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
   - name: Install pinned Android SDK
     run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
   - name: Optional Firebase client configuration
     env:
      FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
     run: |
      if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
        printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
      else
        echo 'Building local-tools APK without Firebase project configuration.'
      fi
   - name: Validate, test and build both variants
     run: |
      chmod +x gradlew
      ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
   - name: Upload installable personal-test APK
     uses: actions/upload-artifact@v4
     with:
      name: YESMIN-AI-debug
      path: app/build/outputs/apk/debug/app-debug.apk
      retention-days: 14
      if-no-files-found: error
   - name: Upload test and lint reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: YESMIN-AI-test-reports
      path: |
       app/build/reports/tests/
       app/build/reports/lint-results-debug.html
      retention-days: 14
